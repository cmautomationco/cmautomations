<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4955c">
<title>Life Dashboard</title>
<style>
/* Life Dashboard – personal side of everything.
   Self-contained: no build step, no server needed. Data stays in this browser
   (export a backup from Settings).
   Colour: warm peach-orange leads; calm nautical sky blue in smaller touches. */
@font-face {
  font-family: 'Plus Jakarta Sans';
  font-style: normal;
  font-weight: 400 800;
  font-display: swap;
  src: url('../fonts/plus-jakarta-sans-latin.woff2') format('woff2');
}
:root {
  /* peach-orange (main) */
  --accent: #ec7a3c;          /* lines, bars, rings, bars on headers */
  --accent-fill: #f4955c;     /* buttons and selected states (dark text on top) */
  --accent-fill-hover: #ef8445;
  --on-accent: #3b1606;
  --accent-strong: #a9481a;   /* peach text and big numbers */
  --accent-soft: #fde3d2;
  --accent-wash: #fff4ec;
  /* nautical sky blue (calm touches) */
  --sky: #1e6a9e;
  --sky-strong: #154b71;
  --sky-soft: #dcebf6;
  --sky-wash: #f1f7fc;
  --ink: #1b1f2a;
  --ink-2: #3d4352;
  --muted: #6d6a73;
  --line: #f0e3d8;
  --line-soft: #f8eee6;
  --bg: #fcf6f1;
  --surface: #ffffff;
  --now: #a9481a;
  --now-bg: #fde3d2;
  --sched: #154b71;
  --sched-bg: #dcebf6;
  --park: #5d6675;
  --park-bg: #eef0f3;
  --good: #15803d;
  --good-bg: #dcfce7;
  --warn: #a16207;
  --warn-bg: #fef3c7;
  --bad: #dc2626;
  --bad-bg: #fee2e2;
  --grid: #f2e8e0;
  --bar-mute: #d9d3ce;
  --shadow: 0 1px 2px rgba(169, 72, 26, .05), 0 6px 20px rgba(169, 72, 26, .07);
  --shadow-lg: 0 18px 50px rgba(40, 20, 10, .2);
  --radius: 18px;
  --radius-sm: 10px;
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: #f4a26b; --accent-fill: #f4a26b; --accent-fill-hover: #f7b484; --on-accent: #2b1206;
    --accent-strong: #ffc59c; --accent-soft: #4a2a18; --accent-wash: #261a14;
    --sky: #6aa9d8; --sky-strong: #a6cdec; --sky-soft: #173450; --sky-wash: #121f2d;
    --ink: #f1ece8; --ink-2: #d2cbc5; --muted: #a39b94; --line: #33302f; --line-soft: #252322;
    --bg: #12100f; --surface: #1b1918;
    --now: #ffc59c; --now-bg: #4a2a18; --sched: #a6cdec; --sched-bg: #173450; --park: #b3b0ad; --park-bg: #2a2827;
    --good: #4ade80; --good-bg: #123322; --warn: #fbbf24; --warn-bg: #3a2c0c; --bad: #f87171; --bad-bg: #3d1717;
    --grid: #2b2827; --bar-mute: #47423f; --shadow: 0 1px 2px rgba(0,0,0,.35); --shadow-lg: 0 18px 50px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent: #f4a26b; --accent-fill: #f4a26b; --accent-fill-hover: #f7b484; --on-accent: #2b1206;
  --accent-strong: #ffc59c; --accent-soft: #4a2a18; --accent-wash: #261a14;
  --sky: #6aa9d8; --sky-strong: #a6cdec; --sky-soft: #173450; --sky-wash: #121f2d;
  --ink: #f1ece8; --ink-2: #d2cbc5; --muted: #a39b94; --line: #33302f; --line-soft: #252322;
  --bg: #12100f; --surface: #1b1918;
  --now: #ffc59c; --now-bg: #4a2a18; --sched: #a6cdec; --sched-bg: #173450; --park: #b3b0ad; --park-bg: #2a2827;
  --good: #4ade80; --good-bg: #123322; --warn: #fbbf24; --warn-bg: #3a2c0c; --bad: #f87171; --bad-bg: #3d1717;
  --grid: #2b2827; --bar-mute: #47423f; --shadow: 0 1px 2px rgba(0,0,0,.35); --shadow-lg: 0 18px 50px rgba(0,0,0,.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font); font-size: 14px; line-height: 1.5; color: var(--ink);
  background: var(--bg); -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: 16.5px; font-weight: 750; letter-spacing: -.01em; }
h3 { font-size: 14px; font-weight: 700; }
p { margin: 0; }
a { color: var(--sky); }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.nav {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 16px 14px;
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 4px;
}
.brand {
  display: flex; align-items: center; gap: 10px; padding: 14px 12px; margin-bottom: 12px; border-radius: 16px;
  background: linear-gradient(135deg, var(--accent-soft), var(--accent-wash) 70%, var(--sky-wash));
  border: 1px solid var(--line);
}
.brand-mark {
  width: 36px; height: 36px; border-radius: 11px; background: var(--accent-fill); color: var(--on-accent);
  display: grid; place-items: center; font-weight: 800; font-size: 16px; flex: 0 0 auto;
}
.brand b { display: block; font-size: 15px; }
.brand small { color: var(--sky-strong); font-size: 12px; font-weight: 600; }
.nav-label { font-size: 11px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 4px; }
.nav button {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 1px solid transparent;
  background: none; border-radius: 12px; cursor: pointer; text-align: left; font-weight: 600; color: var(--ink-2);
}
.nav button:hover { background: var(--line-soft); }
.nav button.on { background: var(--accent-wash); border-color: var(--accent-soft); color: var(--accent-strong); box-shadow: inset 3px 0 0 var(--accent); }
.nav .ico { width: 22px; text-align: center; font-size: 16px; }
.nav .tag { margin-left: auto; font-size: 10px; font-weight: 800; background: var(--sky); color: #fff; border-radius: 999px; padding: 1px 7px; }
:root[data-theme="dark"] .nav .tag { color: #0b1420; }
.nav-foot { margin-top: auto; padding: 12px; color: var(--sky-strong); font-size: 12px; background: var(--sky-wash); border: 1px solid var(--sky-soft); border-radius: 12px; }

main { padding: 24px 32px 120px; max-width: 1260px; width: 100%; min-width: 0; }

/* Page banner – the box over every section */
.page-head {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
  padding: 22px 24px; border-radius: 22px; border: 1px solid var(--line);
  background:
    radial-gradient(circle at 100% 0%, var(--sky-soft) 0, transparent 38%),
    linear-gradient(120deg, var(--accent-soft) 0%, var(--accent-wash) 55%, var(--surface) 100%);
  box-shadow: var(--shadow);
}
.page-head h1 { color: var(--ink); }
.page-head p { color: var(--ink-2); margin-top: 6px; }

/* Section label – small blue box above a group */
.section-label {
  display: inline-flex; align-items: center; gap: 8px; margin: 26px 0 12px; padding: 6px 14px 6px 10px;
  background: var(--sky-soft); color: var(--sky-strong); border-radius: 999px; font-weight: 750; font-size: 13.5px;
}
.section-label span { font-size: 15px; }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.mt { margin-top: 16px; }
.mt-s { margin-top: 8px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.strong { font-weight: 700; }

/* ---------- cards: each one a framed box with its own header band ---------- */
.card {
  --pad: 18px; --head-bg: var(--accent-wash); --head-bar: var(--accent); --head-line: var(--accent-soft);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--pad); box-shadow: var(--shadow); min-width: 0; overflow: hidden;
}
.card.calm { --head-bg: var(--sky-wash); --head-bar: var(--sky); --head-line: var(--sky-soft); }
.card-head {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  margin: calc(-1 * var(--pad)) calc(-1 * var(--pad)) 16px; padding: 14px var(--pad);
  background: var(--head-bg); border-bottom: 1px solid var(--head-line);
}
.card-head h2 { display: flex; align-items: center; gap: 9px; }
.card-head h2::before { content: ''; width: 4px; height: 17px; border-radius: 3px; background: var(--head-bar); flex: 0 0 auto; }
.card-head p { color: var(--muted); font-size: 12.5px; margin-top: 3px; padding-left: 13px; }
.card.flat { box-shadow: none; }
.card.tint { background: var(--sky-wash); border-color: var(--sky-soft); }
.card.tint h2, .card.tint h3 { color: var(--sky-strong); }
.card.warm { background: var(--accent-wash); border-color: var(--accent-soft); }

/* ---------- tabs ---------- */
.tabs {
  display: flex; gap: 4px; overflow-x: auto; margin-bottom: 18px; scrollbar-width: none; padding: 5px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); width: max-content; max-width: 100%;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  flex: 0 0 auto; border: 0; background: transparent; padding: 8px 15px; border-radius: 999px;
  font-weight: 650; cursor: pointer; color: var(--ink-2);
}
.tabs button:hover { background: var(--line-soft); }
.tabs button.on { background: var(--accent-fill); color: var(--on-accent); }
.tabs button::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 1px; }
.tabs button:nth-child(even)::before { background: var(--sky); }
.tabs button:nth-child(3n)::before { background: var(--good); }
.tabs button.on::before { background: var(--on-accent); }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  padding: 8px 14px; border-radius: 11px; cursor: pointer; font-weight: 650; white-space: nowrap; min-height: 38px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-fill-hover); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--line-soft); }
.btn.sm { padding: 4px 10px; min-height: 30px; font-size: 12.5px; border-radius: 8px; }
.btn.danger { color: var(--bad); }
.icon-btn { border: 0; background: none; cursor: pointer; padding: 6px; border-radius: 8px; color: var(--muted); font-size: 15px; line-height: 1; min-width: 30px; min-height: 30px; }
.icon-btn:hover { background: var(--line-soft); color: var(--ink); }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 8px 11px; min-height: 38px; width: 100%;
}
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--sky); outline-offset: 1px; }
label.field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 650; color: var(--ink-2); min-width: 0; }
.form-row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); align-items: end; }

/* ---------- pills & chips ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.pill.now { background: var(--now-bg); color: var(--now); }
.pill.schedule { background: var(--sched-bg); color: var(--sched); }
.pill.park { background: var(--park-bg); color: var(--park); }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.plain { background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
.pill.sky { background: var(--sky-soft); color: var(--sky-strong); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 12.5px; }
.chip.on { background: var(--sky-soft); border-color: var(--sky); color: var(--sky-strong); }

/* ---------- stat tiles: boxed with a coloured cap ---------- */
.stat { display: flex; flex-direction: column; gap: 2px; }
.card.stat { background: var(--accent-wash); border-color: var(--accent-soft); padding: 18px 20px; }
.grid > .card.stat:nth-child(even), .card.stat.t-sky { background: var(--sky-wash); border-color: var(--sky-soft); }
.grid > .card.stat:nth-child(even) .value, .card.stat.t-sky .value { color: var(--sky-strong); }
.card.stat.t-peach { background: var(--accent-wash); border-color: var(--accent-soft); }
.card.stat.t-peach .value { color: var(--accent-strong); }
.card.stat.t-green { background: var(--good-bg); border-color: transparent; }
.card.stat.t-green .value { color: var(--good); }
.stat .label { text-transform: none; }
.stat .sub { font-size: 12px; color: var(--muted); }
.stat .label { color: var(--muted); font-size: 12.5px; font-weight: 650; }
.stat .value { font-size: 28px; font-weight: 750; letter-spacing: -.02em; color: var(--accent-strong); }
.stat .delta { font-size: 12px; font-weight: 650; color: var(--muted); }
.stat .delta.up { color: var(--good); }
.stat .delta.down { color: var(--bad); }
.hero-num { font-size: 52px; font-weight: 750; letter-spacing: -.03em; line-height: 1; color: var(--accent-strong); }
.calm .hero-num { color: var(--sky-strong); }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line-soft); min-width: 0; }
.item:first-child { border-top: 0; }
.item .grow { flex: 1; min-width: 0; }
.item .title { font-weight: 650; overflow-wrap: anywhere; }
.item .meta { color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.check {
  width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); flex: 0 0 auto; cursor: pointer;
  display: grid; place-items: center; color: transparent; font-size: 13px; font-weight: 800; padding: 0;
}
.check:hover { border-color: var(--sky); }
.check.on { background: var(--sky); border-color: var(--sky); color: #fff; }
:root[data-theme="dark"] .check.on { color: #0b1420; }
.empty { color: var(--muted); padding: 14px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; font-size: 13px; background: var(--line-soft); }

/* ---------- top three ---------- */
.three { display: grid; gap: 10px; }
.three-item { display: flex; gap: 12px; align-items: center; padding: 14px; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 14px; background: var(--surface); }
.three-item:nth-child(2) { border-left-color: var(--sky); }
.three-item.done { opacity: .6; }
.three-item.done .title { text-decoration: line-through; }
.three-num { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; font-weight: 800; }
.three-item:nth-child(2) .three-num { background: var(--sky-soft); color: var(--sky-strong); }

/* ---------- scorer ---------- */
.scorer { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(220px, 1fr); gap: 20px; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line-soft); }
.slider:first-of-type { border-top: 0; }
.slider .name { font-weight: 700; }
.slider .hint { color: var(--muted); font-size: 12px; grid-column: 1 / -1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); width: 38px; height: 34px; cursor: pointer; font-weight: 700; color: var(--ink-2); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--accent-fill); color: var(--on-accent); }
.verdict {
  border-radius: 18px; padding: 18px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center;
  border: 1px solid var(--accent-soft); background: linear-gradient(160deg, var(--accent-wash), var(--surface) 60%, var(--sky-wash));
}
.verdict .big { font-size: 56px; font-weight: 750; letter-spacing: -.03em; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.verdict .v-sum { font-size: 12.5px; color: var(--muted); font-weight: 600; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.verdict .v-name { font-size: 20px; font-weight: 750; }
.verdict .v-name.now { color: var(--accent-strong); }
.verdict .v-name.schedule { color: var(--sky-strong); }
.verdict .v-name.park { color: var(--park); }
.sl-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 28px; gap: 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line-soft); }
.sl-row:first-child { border-top: 0; }
.sl-name b { display: block; font-size: 14px; }
.sl-name span { display: block; font-size: 12px; color: var(--muted); }
.sl-val { font-weight: 800; font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; }
.formula-card { background: linear-gradient(135deg, var(--accent-wash), var(--surface) 55%, var(--sky-wash)); }
.eyebrow { font-size: 11.5px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.f-eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 14px 0; }
.f-chip { font-size: clamp(18px, 2.6vw, 30px); font-weight: 750; letter-spacing: -.02em; padding: 6px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.f-chip.res { background: var(--accent-fill); color: var(--on-accent); border-color: var(--accent-fill); }
.f-op { font-size: clamp(18px, 2.4vw, 26px); color: var(--muted); font-weight: 600; }
.tcard { position: relative; }
.score-big { position: absolute; top: 9px; right: 12px; font-size: 20px; font-weight: 750; font-variant-numeric: tabular-nums; color: var(--ink); }
.has-score .grow > .title { padding-right: 58px; }
.hours-bar { height: 4px; border-radius: 999px; background: var(--accent); margin-top: 6px; }
table.sys { width: 100%; border-collapse: collapse; font-size: 13px; }
table.sys th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 650; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.sys th.num, table.sys td.num { text-align: right; }
table.sys td { padding: 8px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
table.sys input { min-height: 32px; padding: 5px 8px; }
table.sys td.num input { width: 72px; text-align: right; }
table.sys .saved { font-weight: 750; font-variant-numeric: tabular-nums; }
.verdict .why { color: var(--ink-2); font-size: 12.5px; max-width: 260px; }
.ring { width: 120px; height: 120px; }
.formula { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--sky-wash); border: 1px solid var(--sky-soft); border-radius: 10px; padding: 10px 12px; color: var(--sky-strong); overflow-x: auto; white-space: nowrap; }

/* ---------- buckets ---------- */
.buckets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.bucket { --b: var(--accent); --b-bg: var(--accent-wash); --b-line: var(--accent-soft); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; box-shadow: var(--shadow); overflow: hidden; }
.bucket.schedule { --b: var(--sky); --b-bg: var(--sky-wash); --b-line: var(--sky-soft); }
.bucket.park { --b: var(--park); --b-bg: var(--park-bg); --b-line: var(--line); }
.bucket-head { display: flex; align-items: center; justify-content: space-between; margin: -14px -14px 10px; padding: 12px 14px; background: var(--b-bg); border-bottom: 1px solid var(--b-line); border-top: 4px solid var(--b); }
.bucket-head h3 { display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
.dot.now { background: var(--accent); } .dot.schedule { background: var(--sky); } .dot.park { background: var(--park); }

.tcard .grow { flex: 1; min-width: 0; }
.score-badge { font-weight: 800; font-size: 12px; border-radius: 8px; padding: 2px 7px; background: var(--accent-soft); color: var(--accent-strong); font-variant-numeric: tabular-nums; }

/* ---------- check-in ---------- */
.scale { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
.scale button {
  height: 48px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer;
}
.scale button:hover { border-color: var(--accent); background: var(--accent-wash); }
.scale button.on { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
.scale.compact { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.scale-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; }
.mini-scale { display: inline-flex; gap: 4px; }
.mini-scale button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.mini-scale button.on { background: var(--sky); border-color: var(--sky); color: #fff; }
:root[data-theme="dark"] .mini-scale button.on { color: #0b1420; }

/* ---------- focus ---------- */
.focus-clock { font-size: 64px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--sky-strong); line-height: 1; }
.progress { height: 8px; background: var(--sky-soft); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--sky); border-radius: 999px; }
.progress.warm { background: var(--accent-soft); }
.progress.warm > span { background: var(--accent); }
.meter { height: 8px; background: var(--line-soft); border-radius: 999px; overflow: hidden; }
.meter > span { display: block; height: 100%; border-radius: 999px; background: var(--sky); }
.meter.warn > span { background: #d97706; }
.meter.bad > span { background: var(--bad); }

/* ---------- board ---------- */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; min-width: 0; box-shadow: var(--shadow); overflow: hidden; }
.col h3 { margin: -10px -10px 4px; padding: 12px 14px; display: flex; justify-content: space-between; background: var(--accent-wash); border-bottom: 1px solid var(--accent-soft); border-top: 4px solid var(--accent); }
.col:nth-child(even) h3 { background: var(--sky-wash); border-bottom-color: var(--sky-soft); border-top-color: var(--sky); }

/* ---------- chart ---------- */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-family: var(--font); fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .end-label { fill: var(--ink); font-weight: 700; font-size: 12px; }
#tip {
  position: fixed; z-index: 60; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  border-radius: 10px; padding: 7px 10px; box-shadow: var(--shadow-lg); font-size: 12px; min-width: 90px; opacity: 0; transition: opacity .1s;
}

#tip .v { font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 6px; }
#tip .v i { width: 12px; height: 2px; background: var(--accent); display: inline-block; border-radius: 2px; }
#tip .l { color: var(--muted); }
details.table-view { margin-top: 8px; }
details.table-view summary { cursor: pointer; color: var(--sky); font-size: 12px; font-weight: 600; }
table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
table.data th, table.data td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line-soft); }

/* ---------- habits grid ---------- */
.habit-grid { display: grid; grid-template-columns: minmax(90px, 1.6fr) repeat(7, minmax(22px, 32px)); gap: 6px; align-items: center; font-size: 12.5px; }

.habit-grid .h { color: var(--muted); text-align: center; font-size: 11px; }
.habit-cell { width: 100%; height: 28px; border-radius: 8px; background: var(--line-soft); border: 1px solid var(--line); cursor: pointer; padding: 0; }
.habit-cell.on { background: var(--sky); border-color: var(--sky); }

/* ---------- modal & toast ---------- */
.overlay { position: fixed; inset: 0; background: rgba(27, 18, 12, .45); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 22px; width: min(860px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 22px; box-shadow: var(--shadow-lg); }
.modal-head {
  display: flex; justify-content: space-between; align-items: center; margin: -22px -22px 18px; padding: 16px 22px;
  background: linear-gradient(120deg, var(--accent-soft), var(--accent-wash) 60%, var(--sky-wash)); border-bottom: 1px solid var(--line);
}
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--sky-strong); color: #fff; padding: 11px 18px; border-radius: 12px; font-weight: 650; z-index: 70; opacity: 0; transition: .2s; pointer-events: none; max-width: calc(100vw - 32px); }
:root[data-theme="dark"] #toast { color: #0b1420; }
#toast.show { opacity: 1; transform: translateX(-50%); }
.fab { position: fixed; right: 24px; bottom: 24px; z-index: 40; border: 0; background: var(--accent-fill); color: var(--on-accent); border-radius: 999px; padding: 14px 20px; font-weight: 750; box-shadow: var(--shadow-lg); cursor: pointer; display: flex; align-items: center; gap: 8px; }
.fab:hover { background: var(--accent-fill-hover); }
.fab span { font-size: 20px; line-height: 1; }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-weight: 600; margin-bottom: 14px; }
.welcome {
  max-width: 680px; margin: 7vh auto; text-align: center; padding: 40px 28px; border-radius: 26px; border: 1px solid var(--line);
  background: radial-gradient(circle at 100% 0%, var(--sky-soft) 0, transparent 40%), linear-gradient(150deg, var(--accent-soft), var(--accent-wash) 55%, var(--surface));

}

.welcome p { color: var(--ink-2); margin: 12px auto 22px; max-width: 520px; }

/* ---------- task manager & priority bar ---------- */
.tm-add {
  display: grid; grid-template-columns: minmax(120px, 1fr) minmax(200px, 1.6fr) minmax(130px, 1fr) auto; gap: 10px 14px; align-items: end;

}
.tm-add.no-area { grid-template-columns: minmax(200px, 1.6fr) minmax(130px, 1fr) auto; }

.tm-filters { margin-top: 14px; }
.tm-group { margin-top: 16px; }
.tm-group-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); padding: 0 2px 6px; border-bottom: 1px solid var(--line-soft); }
.tm-group-head .n { color: var(--muted); font-weight: 650; }
.tm-row { --p-col: var(--line); display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-left: 4px solid var(--p-col); border-radius: 12px; margin-top: 8px; background: var(--surface); }

.p-badge { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; background: var(--p-bg); color: var(--p-ink); flex: 0 0 auto; font-variant-numeric: tabular-nums; }

.p2 { --p-col: #a9c4d9; --p-bg: var(--sky-wash); --p-ink: var(--sky-strong); }
.p1 { --p-col: var(--line); --p-bg: var(--line-soft); --p-ink: var(--muted); }
input[type=range].prio {
  -webkit-appearance: none; appearance: none; width: 100%; height: 10px; border-radius: 999px; margin: 8px 0;
  background: linear-gradient(to right, var(--accent) var(--fill, 50%), var(--line-soft) var(--fill, 50%)); border: 1px solid var(--line); cursor: pointer;
}
input[type=range].prio::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 4px solid var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,.18); }
input[type=range].prio::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 4px solid var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,.18); }
input[type=range].prio:focus-visible { outline: 2px solid var(--sky); outline-offset: 4px; }
.prio-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-weight: 600; }
.tcard .prio-box { display: flex; align-items: center; gap: 8px; margin-top: 6px; }

/* ---------- productivity ---------- */
.parts .part { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(0, 2fr) 64px; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line-soft); }
.parts .part:first-child { border-top: 0; }
.parts .part b { font-size: 13px; display: block; }
.parts .part span.small { display: block; }
.parts .pts { text-align: right; font-weight: 750; font-variant-numeric: tabular-nums; }
.tip { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 14px; margin-top: 10px; background: var(--surface); }
.tip:first-of-type { margin-top: 0; }
.tip .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); flex: 0 0 auto; font-size: 17px; }
.calm .tip .ico { background: var(--sky-soft); }
.tip .grow b { display: block; }
.tip .gain { flex: 0 0 auto; }
.tip-side { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; flex: 0 0 auto; }
.big-delta { font-size: 13px; font-weight: 700; }
.big-delta.up { color: var(--good); } .big-delta.down { color: var(--bad); } .big-delta.flat { color: var(--muted); }

/* ---------- content strategy ---------- */
.strat-grid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pillar-row { display: grid; grid-template-columns: minmax(0, 1.2fr) 90px minmax(0, 2fr) auto; gap: 8px; align-items: center; margin-top: 8px; }

.rhythm .day.today { border-color: var(--accent); background: var(--accent-wash); }
.rhythm .day b { font-size: 12px; }
.rhythm select { font-size: 12px; padding: 6px 8px; min-height: 34px; }

/* ---------- ADHD hub switch, pinned Today's 3, guided flows ---------- */
.subhub { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.subhub button { display: flex; gap: 12px; align-items: center; text-align: left; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; box-shadow: var(--shadow); }
.subhub button b { display: block; font-size: 15px; }
.subhub small { color: var(--muted); font-size: 12px; }
.subhub .sh-ico { font-size: 24px; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); flex: 0 0 auto; }
.subhub button:nth-child(2) .sh-ico { background: var(--sky-soft); }
.subhub button.on { border-color: var(--accent); background: var(--accent-wash); box-shadow: inset 0 0 0 1px var(--accent); }
.subhub button:nth-child(2).on { border-color: var(--sky); background: var(--sky-wash); box-shadow: inset 0 0 0 1px var(--sky); }
.pin3 { background: var(--surface); border: 1px solid var(--accent-soft); border-left: 5px solid var(--accent); border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
.pin-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.pin-items { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.pin-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: var(--accent-wash); min-width: 0; font-weight: 600; font-size: 13px; }
.pin-item .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pin-item.done { opacity: .55; }
.pin-item.done .grow { text-decoration: line-through; }
.pin-item .three-num { width: 24px; height: 24px; font-size: 12px; }
.sos-btn { width: 100%; padding: 22px; border-radius: 18px; border: 0; background: var(--accent-fill); color: var(--on-accent); font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: var(--shadow); }
.sos-btn:hover { background: var(--accent-fill-hover); }
.sos-btn.sky { background: var(--sky); color: #fff; }
:root[data-theme="dark"] .sos-btn.sky { color: #0b1420; }
.modal.flow { width: min(560px, 100%); }
.flow-q { font-size: 18px; font-weight: 750; margin-bottom: 10px; }
.mood-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.mood-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 4px; font-size: 22px; font-weight: 800; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.mood-btn small { font-size: 11px; color: var(--muted); font-weight: 600; }
.mood-btn.on, .mood-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
.opt { text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.opt.on { border-color: var(--accent); background: var(--accent-wash); box-shadow: inset 0 0 0 1px var(--accent); }
.breath-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 0; }
.breath { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, var(--sky-soft), var(--sky-wash)); border: 3px solid var(--sky); animation: breathe 16s ease-in-out infinite; }
@keyframes breathe { 0% { transform: scale(.55); } 25% { transform: scale(1); } 50% { transform: scale(1); } 75% { transform: scale(.55); } 100% { transform: scale(.55); } }
@media (prefers-reduced-motion: reduce) { .breath { animation: none; } }
/* planner */
.week-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day-cell { border: 1px solid var(--line); border-radius: 14px; padding: 10px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; min-width: 0; font-size: 12.5px; }
.day-cell.today { border-color: var(--accent); background: var(--accent-wash); box-shadow: inset 0 0 0 1px var(--accent); }
.day-cell.past { background: var(--line-soft); }
.dc-head { display: flex; justify-content: space-between; align-items: center; }
.day-cell input { font-size: 12px; padding: 5px 8px; min-height: 30px; }
.dc-block { font-weight: 700; color: var(--sky-strong); }
.dc-items div { overflow-wrap: anywhere; padding: 2px 0; }
.card.step.done { opacity: .82; }
/* routines, consistency, timeline */
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dt { width: 14px; height: 14px; border-radius: 50%; background: var(--line-soft); border: 1px solid var(--line); }
.dt.on { background: var(--accent); border-color: var(--accent); }
.dt.today { outline: 2px solid var(--sky); outline-offset: 1px; }
.r-step.done .title { text-decoration: line-through; opacity: .6; }
.timeline { position: relative; border-left: 1px solid var(--line); margin-left: 4px; }
.tl-hour { position: absolute; left: 0; right: 0; border-top: 1px solid var(--grid); }
.tl-hour span { position: absolute; left: 6px; top: -8px; font-size: 11px; color: var(--muted); background: var(--surface); padding: 0 4px; font-variant-numeric: tabular-nums; }
.tl-block { position: absolute; right: 6px; border-radius: 10px; padding: 4px 8px; font-size: 12px; overflow: hidden; display: flex; gap: 6px; align-items: flex-start; background: var(--accent-soft); border-left: 4px solid var(--accent); z-index: 1; }
.tl-block.f { background: var(--sky-soft); border-left-color: var(--sky); }
.tl-block.e { background: var(--sky-wash); border-left-color: var(--sky-strong); }
.tl-block.c { background: var(--good-bg); border-left-color: var(--good); }
.tl-block.n { background: var(--line-soft); border-left-color: var(--muted); }
.tl-block .icon-btn { margin-left: auto; min-height: 20px; min-width: 20px; padding: 2px; }

.ping-row { display: flex; align-items: center; gap: 12px; justify-content: space-between; max-width: 320px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}
@media (max-width: 860px) {

  main { padding: 16px 16px 110px; }
  .page-head { padding: 18px; border-radius: 18px; }
  .g2, .g3, .scorer, .buckets { grid-template-columns: 1fr; }
  .span2 { grid-column: auto; }
  h1 { font-size: 22px; }
  .scale { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .fab { right: 16px; bottom: 16px; }
  .tm-add, .tm-add.no-area { grid-template-columns: 1fr; }
  .tm-row { flex-wrap: wrap; }
  .tip { flex-wrap: wrap; }
  .subhub, .pin-items { grid-template-columns: 1fr; }
  .week-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mood-btn { font-size: 18px; }
  .tip-side { flex-direction: row; width: 100%; padding-left: 46px; align-items: center; justify-content: space-between; }
  .parts .part { grid-template-columns: minmax(0, 1fr) 64px; }
  .parts .part .progress { grid-column: 1 / -1; grid-row: 2; }
  .sl-row { grid-template-columns: 110px minmax(0, 1fr) 24px; gap: 10px; }
  .sys-wrap { overflow-x: auto; }
  table.sys { min-width: 560px; }
  .tm-row .prio-box { width: 100%; order: 5; }
  .strat-grid { grid-template-columns: 1fr; }
  .pillar-row { grid-template-columns: minmax(0, 1fr) 80px auto; }
  .pillar-row .about { grid-column: 1 / -1; grid-row: 2; }
}
@media (max-width: 520px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .board { grid-template-columns: 1fr; }
  .stat .value { font-size: 23px; }
  .hero-num { font-size: 44px; }
  .seg button { width: 34px; }

}

<div class="app">
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<button class="fab" data-act="add-task" aria-label="Score a new task or idea"><span>+</span> New task or idea</button>
<div id="modal"></div>
<div id="tip" role="status" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>

/* =====================================================================
   Helpers

  var budget = sum(S.finance.budgets, function (b) { return +b.limit || 0; });

}
